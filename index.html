<!DOCTYPE html>
<html><head><script src="config.js"></script><meta charset="utf-8">
<title>Coordinator Data Analysis</title>
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#0f1b3d;--mu:#64748b;--ac:#2563eb;--nv:#0b1f4d;--bd:#e2e8f0;--up:#16a34a;--dn:#dc2626}
[data-t=dark]{--bg:#0b1220;--card:#131c31;--tx:#e6ecff;--mu:#94a3b8;--bd:#24304d;--nv:#060b17}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
#side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--nv);color:#cbd5ff;padding:14px 10px;overflow:auto;transition:.25s;z-index:30}
#logo{height:38px;max-width:140px;object-fit:contain;border-radius:8px}.lg{height:26px;width:26px;object-fit:contain;vertical-align:middle;border-radius:6px;background:#fff;padding:2px}#side h2{color:#fff;font-size:15px;margin:6px 10px 14px}#side a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;margin:2px 0}
#side a:hover{background:#ffffff18}#side a.on{background:var(--ac);color:#fff}
#main{margin-left:230px;transition:.25s}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}.chip{background:var(--bg);padding:5px 10px;border-radius:20px;font-size:12px;color:var(--mu)}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:7px 13px;cursor:pointer}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn:hover{filter:brightness(1.1)}
#flt{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px 0;align-items:center}
#flt input,#flt select,.msb{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:7px 10px}
.ms{position:relative}.msb{cursor:pointer}.msb b{background:var(--ac);color:#fff;border-radius:10px;padding:0 7px;margin-left:4px;font-size:11px}
.msp{position:absolute;top:110%;left:0;width:310px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 30px #0003;padding:8px;z-index:40}
.msp input[type=text]{width:100%}.msa{display:flex;gap:14px;padding:6px 2px}.msa a{color:var(--ac);cursor:pointer;font-size:12px}
.mso{max-height:230px;overflow:auto}.mso label{display:flex;gap:8px;padding:5px 2px;font-size:13px;cursor:pointer}
#view{padding:16px 18px 40px;animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 10px #0b1f4d0d;transition:.2s}
.card.k{cursor:pointer}.card.k:hover,.card.cl:hover{transform:translateY(-3px);box-shadow:0 10px 24px #2563eb22}.cl{cursor:pointer}
.k .l{color:var(--mu);font-size:12px;display:flex;justify-content:space-between}.k .v{font-size:26px;font-weight:700;margin:6px 0}.k .v.s{font-size:15px;word-break:break-all}
.b{font-size:12px;padding:2px 7px;border-radius:10px}.up{background:#16a34a22;color:var(--up)}.dn{background:#dc262622;color:var(--dn)}.na{background:var(--bg);color:var(--mu)}
h3{margin:18px 0 10px;font-size:15px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--card)}.sc{overflow:auto;max-height:560px}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#38bdf8);border-radius:6px;transition:width .6s}
.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}.hm div{padding:12px 4px;border-radius:8px;text-align:center;font-size:12px;cursor:default}
.r1{background:linear-gradient(135deg,#f59e0b,#fde68a);color:#000}.r2{background:linear-gradient(135deg,#94a3b8,#e2e8f0);color:#000}.r3{background:linear-gradient(135deg,#b45309,#fdba74);color:#000}
.sk{height:90px;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--bd) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty,#err{padding:40px;text-align:center;color:var(--mu)}#err{background:#dc262615;color:var(--dn);margin:14px 18px;border-radius:12px;padding:14px}
.pl{display:flex;gap:8px;flex-wrap:wrap}.pl button{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;cursor:pointer}.pl button.on{border-color:var(--ac);background:var(--ac);color:#fff}.pl button:disabled{opacity:.5;cursor:not-allowed}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px;animation:pls 1.4s infinite}@keyframes pls{50%{opacity:.25}}
.sb{padding:3px 11px;border-radius:12px;font-size:12px;font-weight:600}.alr{padding:14px;border-radius:14px;margin:12px 0;font-weight:600}.btn:disabled{opacity:.45;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.cal .wd{text-align:center;font-weight:600;color:var(--mu);font-size:12px;padding:4px}
.ac{border-radius:12px;padding:8px 4px;text-align:center;min-height:96px;cursor:pointer;border:1px solid transparent;transition:.15s;display:flex;flex-direction:column;justify-content:center;gap:2px}.ac:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0b1f4d22}
.ac.neu{background:var(--bg);color:var(--mu);border:1px dashed var(--bd)}.ac.tdy{outline:2px solid var(--ac)}.as{font-size:22px;line-height:1.2;min-height:28px}.ad{font-size:18px;font-weight:700}.an{font-size:11px;min-height:14px}
.lgd{display:flex;flex-wrap:wrap;gap:8px}.lgd span{padding:6px 10px;border-radius:10px;font-size:13px}.cl{cursor:pointer}
@media(max-width:860px){.as{font-size:16px;min-height:20px}.ad{font-size:14px}.an{font-size:9px}.ac{min-height:70px;padding:4px 2px}}
#modal[hidden],#toast[hidden]{display:none!important}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0b1f4d;color:#fff;padding:9px 18px;border-radius:20px;z-index:60}textarea.rt{width:100%;min-height:380px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font:14px/1.5 Consolas,monospace}#modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal>div{background:var(--card);border-radius:18px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:20px}
.ins li{margin:6px 0}canvas{max-height:300px}
@media(max-width:860px){#side{transform:translateX(-100%)}#side.open{transform:none}#main{margin-left:0}.g2{grid-template-columns:1fr}#mb{display:inline-block!important}.hm{grid-template-columns:repeat(6,1fr)}}
</style></head><body>
<nav id="side"><h2><img src="logo.png" class="lg" alt="" onerror="this.outerHTML='📊'"> Coordinator Analysis</h2></nav>
<div id="main">
<header><button id="mb" class="btn g" style="display:none" onclick="side.classList.toggle('open')">☰</button>
<img src="logo.png" id="logo" alt="Logo" onerror="this.style.display='none'"><h1>Coordinator Data Analysis</h1><span class="chip">FY 2026–2027 · v6</span><span class="chip" id="upd">Loading…</span>
<button class="btn" onclick="load()">⟳ Refresh Data</button><button class="btn g" onclick="theme()">🌓</button><button class="btn g" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">⛶</button></header>
<div id="err" hidden></div>
<div id="flt">
<select id="pre" onchange="preset(this.value)"><option value="">Date range…</option><option value="today">Today</option><option value="yest">Yesterday</option><option value="7">Last 7 Days</option><option value="30">Last 30 Days</option><option value="tm">This Month</option><option value="lm">Last Month</option><option value="c">Custom Range</option></select>
<input type="date" id="df" onchange="S.from=this.value;pre.value='c';go()"><input type="date" id="dt" onchange="S.to=this.value;pre.value='c';go()">
<div class="ms" id="mc"><button class="msb"></button><div class="msp" hidden><input type="text" placeholder="Search…"><div class="msa"><a>Select All</a><a>Clear All</a></div><div class="mso"></div></div></div>
<div class="ms" id="me"><button class="msb"></button><div class="msp" hidden><input type="text" placeholder="Search…"><div class="msa"><a>Select All</a><a>Clear All</a></div><div class="mso"></div></div></div>
<button class="btn g" onclick="clearAll()">✕ Clear filters</button></div>
<div id="view"></div></div><div id="toast" hidden></div><div id="modal" hidden onclick="if(event.target==this)this.hidden=true"><div id="mbody"></div></div>
<script>
const CATS=["Ticket Assigned to Zoho","Added in the Outbound Sheet","Added in the Lead's Sheet","Added in the LS","Ticket's Follow-up's (Zoho & Data Entry)","Status Update (Outbound) / Payment's Update (Lead's Sheet)","Lead's Re-Check","Transfer to MT Team / Data Entry Team / Retail POS or Other's","Duplicate Ticket - (Close)","Ticket's QC","Re-assign to Other's","Re-open Ticket","Self Raise + Added in the Outbound Sheet","Self Raise + Assigned it to Zoho","Contact Number or RID Update & Hold"];
const WA=["Added in the LS","Added in the Outbound Sheet","Contact Number or RID Update & Hold","Duplicate Ticket - (Close)","Re-assign to Other's","Re-open Ticket","Self Raise + Added in the Outbound Sheet","Self Raise + Assigned it to Zoho","Status Update (Outbound) / Payment's Update (Lead's Sheet)","Ticket Assigned to Zoho","Ticket's Follow-up's (Zoho & Data Entry)","Ticket's QC","Transfer to MT Team / Data Entry Team / Retail POS or Other's","Visit QC"];
const nk=x=>String(x).toLowerCase().replace(/\s+/g,''),canon=w=>{const k=nk(w);return CATS.concat(WA).find(c=>nk(c)==k)||w};
let RP={date:'',email:'',name:''};
const NAV=[["overview","🏠","Overview"],["coord","👥","Coordinator Performance"],["assign","🧾","Assigner Wise Analysis"],["hour","⏰","Hourly Activity"],["month","📅","Monthly Analysis"],["cat","🗂️","Work Category Analysis"],["att","🗓️","Attendance Management"],["break","⏱️","Break Management"],["growth","📈","Productivity Growth"],["rec","📄","Detailed Records"],["report","📝","Reports"],["set","⚙️","Settings"]];
const PAL=["#2563eb","#38bdf8","#16a34a","#f59e0b","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#64748b","#84cc16","#0ea5e9","#a855f7","#eab308","#06b6d4"];
const $=s=>document.querySelector(s),side=$('#side'),pre=$('#pre');
let D,R=[],F=[],ci={},T={daily:{},monthly:{},cat:{}},S={from:'',to:'',cats:new Set(),emails:new Set()},view='overview',CH=[],RS={k:0,dir:1,q:'',p:0},draws=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>Math.round(n*10)/10,by=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return m},tp=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]);
const pc=(c,p)=>p?(c-p)/p*100:null;
const bd=(c,p)=>{const g=pc(c,p);return g===null?'<span class="b na">n/a</span>':`<span class="b ${g>=0?'up':'dn'}">${g>=0?'▲':'▼'} ${Math.abs(g).toFixed(1)}%</span>`};
const addD=(s,n)=>{const x=new Date(s+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const hr=h=>`${h%12||12} ${h<12?'AM':'PM'}`;
const heat=(v,m)=>`background:rgba(37,99,235,${v?0.1+0.9*v/m:0.03});color:${v/m>.55?'#fff':'inherit'}`;
const base=()=>R.filter(x=>(!S.cats.size||S.cats.has(x.w))&&(!S.emails.size||S.emails.has(x.e)));
function prevF(){if(!S.from||!S.to)return null;const n=Math.round((new Date(S.to)-new Date(S.from))/864e5)+1,pf=addD(S.from,-n),pt=addD(S.from,-1);return base().filter(x=>x.d>=pf&&x.d<=pt)}
const rng=(a,f,t)=>a.filter(x=>x.d>=f&&x.d<=t);

NAV.forEach(n=>{const a=document.createElement('a');a.dataset.v=n[0];a.textContent=n[1]+'  '+n[2];a.onclick=()=>{view=n[0];side.classList.remove('open');render()};side.appendChild(a)});
function theme(){const d=document.documentElement;d.dataset.t=d.dataset.t=='dark'?'':'dark';render()}
function skel(){$('#view').innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(8)+'</div>'}
let BUSY=false,AR=5,LT='';
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('cda',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbGet=()=>idb().then(d=>new Promise(r=>{const q=d.transaction('k').objectStore('k').get('data');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})).catch(()=>null);
const idbSet=v=>idb().then(d=>{d.transaction('k','readwrite').objectStore('k').put(v,'data')}).catch(()=>{});
const api=q=>fetch(API_URL+(API_URL.includes('?')?'&':'?')+q).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j});
const apiR=q=>api(q).catch(()=>new Promise(r=>setTimeout(r,800)).then(()=>api(q)));
const nowIst=()=>({today:new Date().toLocaleString('sv-SE',{timeZone:'Asia/Kolkata'}).slice(0,10),updated:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'})});
const bld=C=>Object.assign({headers:C.headers,rows:C.rows,lastSync:C.lastSync||'',settings:C.settings},nowIst());
async function load(full){
if(BUSY)return;
if(!window.API_URL||API_URL.includes('PASTE')){$('#err').hidden=false;$('#err').textContent='Set API_URL in config.js to your Apps Script web app URL.';$('#view').innerHTML='';return}
BUSY=true;$('#err').hidden=true;
const t0=performance.now();try{let C=full?null:await idbGet();
if(D){window._y=scrollY;$('#upd').textContent='Refreshing…'}else if(C){init(bld(C));$('#upd').textContent='Cached · syncing…'}else if(!IND())skel();
const m=await apiR('mode=meta');
if(m.rows){init(Object.assign({headers:m.headers,rows:m.rows,lastSync:m.lastSync,settings:m.settings},nowIst()));BUSY=false;return}
if(C&&(C.headers.join('|')!=m.headers.join('|')||C.lastRow>m.lastRow||Date.now()-(C.fullAt||0)>216e5))C=null;
const have=C?C.lastRow:1,CH=5000,jobs=[];for(let a=have+1;a<=m.lastRow;a+=CH)jobs.push([a,Math.min(m.lastRow,a+CH-1)]);
const out=[];let i=0,done=0;
await Promise.all(Array.from({length:Math.min(6,jobs.length)},async()=>{while(i<jobs.length){const k=i++;out[k]=(await apiR('mode=rows&from='+jobs[k][0]+'&to='+jobs[k][1])).rows;done++;$('#upd').textContent='Loading '+Math.round(done/jobs.length*100)+'%'}}));
const N={headers:m.headers,rows:(C?C.rows:[]).concat(...out),lastRow:m.lastRow,lastSync:m.lastSync,settings:m.settings,fullAt:C?C.fullAt:Date.now()};
idbSet(N);LT=((performance.now()-t0)/1000).toFixed(1);if(D)window._y=scrollY;init(bld(N))
}catch(e){$('#err').hidden=false;$('#err').textContent='Data connection failed: '+(e.message||e);if(!D&&!IND())$('#view').innerHTML=''}
BUSY=false}
function init(d){D=d;const h=d.headers;ci={ts:h.findIndex(x=>/timestamp/i.test(x)),em:h.findIndex(x=>/email/i.test(x)),wk:h.findIndex(x=>/work/i.test(x)),as:h.findIndex(x=>/assign/i.test(x))};
if(ci.ts<0||ci.em<0||ci.wk<0){$('#err').hidden=false;$('#err').textContent='Could not find Timestamp / Email / Work columns. Headers found: '+h.join(' | ');return}
R=d.rows.map(r=>{const t=String(r[ci.ts]);return{d:t.slice(0,10),m:t.slice(0,7),h:+t.slice(11,13),e:String(r[ci.em]).trim().toLowerCase(),w:canon(String(r[ci.wk]).trim()),a:ci.as>=0?String(r[ci.as]).trim():'',r}}).filter(x=>/^\d{4}-\d\d-\d\d/.test(x.d)&&x.e);
T=Object.assign({daily:{},monthly:{},cat:{}},d.settings||{});
$('#upd').textContent='Updated: '+d.updated;
const extra=[...new Set(R.map(x=>x.w))].filter(w=>w&&!CATS.includes(w));
const cats=CATS.concat(extra),ems=[...new Set(R.map(x=>x.e))].sort();
draws=[];ms('#mc','Work Done',cats,S.cats);ms('#me','Coordinators',ems,S.emails);if(window._pre!=null){pre.value=window._pre;window._pre=null}go();const y=window._y;if(y!=null){setTimeout(()=>{scrollTo(0,y);window._y=null},80)}}
function ms(sel,title,opts,set){const el=$(sel),btn=el.querySelector('.msb'),p=el.querySelector('.msp'),q=p.querySelector('input'),o=p.querySelector('.mso'),[a,c]=p.querySelectorAll('.msa a');
const draw=()=>{const k=q.value.toLowerCase();o.innerHTML=opts.filter(x=>x.toLowerCase().includes(k)).map(x=>`<label><input type=checkbox ${set.has(x)?'checked':''} value="${esc(x)}">${esc(x)}</label>`).join('');btn.innerHTML=`${title} <b>${set.size||'All'}</b>`};
draws.push(draw);draw();btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.msp').forEach(x=>x!==p&&(x.hidden=true));p.hidden=!p.hidden};p.onclick=e=>e.stopPropagation();
q.oninput=draw;o.onchange=e=>{e.target.checked?set.add(e.target.value):set.delete(e.target.value);draw();go()};
a.onclick=()=>{opts.forEach(x=>set.add(x));draw();go()};c.onclick=()=>{set.clear();draw();go()}}
document.addEventListener('click',()=>document.querySelectorAll('.msp').forEach(x=>x.hidden=true));
function preset(v){const t=D.today;let f='',e='';if(v=='today')f=e=t;else if(v=='yest')f=e=addD(t,-1);else if(v=='7'){f=addD(t,-6);e=t}else if(v=='30'){f=addD(t,-29);e=t}
else if(v=='tm'){f=t.slice(0,8)+'01';e=t}else if(v=='lm'){const m=addD(t.slice(0,8)+'01',-1);f=m.slice(0,8)+'01';e=m}else if(v=='c')return;S.from=f;S.to=e;go()}
function clearAll(){S.from=S.to='';S.cats.clear();S.emails.clear();pre.value='';draws.forEach(d=>d());go()}
function go(){$('#df').value=S.from;$('#dt').value=S.to;F=base().filter(x=>(!S.from||x.d>=S.from)&&(!S.to||x.d<=S.to));render()}
function kill(){CH.forEach(c=>c.destroy());CH=[]}
function mk(id,type,labels,sets,opt={}){const el=document.getElementById(id);if(!el)return;const dk=document.documentElement.dataset.t=='dark',col=dk?'#94a3b8':'#64748b';
CH.push(new Chart(el,{type,data:{labels,datasets:sets.map((s,i)=>Object.assign({backgroundColor:type=='doughnut'?PAL:PAL[i%15],borderColor:PAL[i%15],tension:.35,borderRadius:6},s))},
options:Object.assign({responsive:true,animation:{duration:700},plugins:{legend:{display:sets.length>1||type=='doughnut',labels:{color:col}}},scales:type=='doughnut'?{}:{x:{ticks:{color:col},stacked:opt.stack,grid:{display:false}},y:{ticks:{color:col},stacked:opt.stack,beginAtZero:true}}},opt.o||{})}))}
function csv(h,rows,name,xls){const e=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;let b,t;
if(xls){b='<table><tr>'+h.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${esc(x==null?'':x)}</td>`).join('')+'</tr>').join('')+'</table>';t='application/vnd.ms-excel'}
else{b='\ufeff'+[h.map(e).join(',')].concat(rows.map(r=>r.map(e).join(','))).join('\n');t='text/csv'}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:t}));a.download=name+(xls?'.xls':'.csv');a.click()}
function cnt(el,n){let s=null;const f=t=>{s=s||t;const p=Math.min(1,(t-s)/700);el.textContent=Math.round(n*p).toLocaleString('en-IN');p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').hidden=false}
function sv(){try{localStorage.setItem('cda',JSON.stringify({view,from:S.from,to:S.to,cats:[...S.cats],emails:[...S.emails],pre:pre.value,RP,RS,t:document.documentElement.dataset.t||'',y:window._y!=null?window._y:scrollY}))}catch(e){}}
const IND=()=>view=='break'||view=='att';
function render(){if(view!='break'){clearInterval(BK.tick);clearInterval(BK.poll)}$('#flt').style.display=IND()?'none':'flex';if(IND()){sv();kill();document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.v==view));(view=='break'?vBreak:vAtt)($('#view'));return}if(!D)return;sv();kill();document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.v==view));
const v=$('#view');if(!R.length){v.innerHTML='<div class=empty>No records found in the sheet.</div>';return}
if(!F.length&&!['set','report'].includes(view)){v.innerHTML='<div class=empty>🔍 No records match the selected filters.</div>';return}
({overview:vOver,coord:vCoord,assign:vAssign,hour:vHour,month:vMonth,cat:vCat,growth:vGrowth,rec:vRec,set:vSet,report:vReport})[view](v)}
function setView(x){view=x;render()}

["Top Work Category",st.tc[0]+' ('+st.tc[1]+')','cat','Most completed category','s'],["Peak Working Hour",hr(+st.th[0])+' ('+st.th[1]+')','hour','Hour with most records','s'],

function insights(st,pf){const L=[],te=st.te;L.push(`🏆 Top performer: <b>${esc(te[0])}</b> (${te[1]} records)`);
const ee=tp(st.e);if(ee.length>1)L.push(`🔻 Lowest activity: <b>${esc(ee[ee.length-1][0])}</b> (${ee[ee.length-1][1]})`);
if(pf&&pf.length){const ps=by(pf,x=>x.e);let bg=null;Object.entries(st.e).forEach(([e,c])=>{const g=pc(c,ps[e]||0);if(g!==null&&(!bg||g>bg[1]))bg=[e,g]});bg&&L.push(`🚀 Highest growth: <b>${esc(bg[0])}</b> (+${bg[1].toFixed(1)}%)`);

function bkAl(){if(!$('#bkA'))return;const a=BK.st&&BK.st.alert,col={Sent:'#16a34a',Pending:'#f59e0b',Failed:'#dc2626'};
$('#bkA').innerHTML=!BK.email||BK.email=='*'?'':`<div class=card style="margin-top:14px"><h3 style="margin-top:0">🔔 Break Limit Alert (WhatsApp)</h3>${a?`Status: <span class=sb style="background:${col[a.status]}22;color:${col[a.status]}">${a.status}</span> · Attempts: ${a.attempts} · Total ${mmss(a.totalSec)} · Extra ${mmss(a.extraSec)}${a.lastError?`<br><small style="color:var(--dn)">${esc(a.lastError)}</small>`:''}${a.status!='Sent'?`<br><br><button class=btn onclick="bkAct('break_retry')">↻ Retry notification</button>`:''}`:'<span style="color:var(--mu)">No limit alert has been triggered today for this employee.</span>'}</div>`}
function bkRows(){const s=BK.st;if(!s||!s.history)return[];const h=s.history.map(x=>Object.assign({},x)),byd={};
h.slice().sort((a,b)=>a.startMs-b.startMs).forEach(x=>{x.d=x.endMs?x.dur:Math.max(0,Math.floor((bkNow()-x.startMs)/1000));const k=x.email+'|'+x.date;byd[k]=(byd[k]||0)+x.d;x.st=!x.endMs?'In Progress':byd[k]>s.allow?'Limit Exceeded':'Completed'});
const f=BK.f,q=f.q.toLowerCase();return h.filter(x=>(!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to)&&(!f.type||x.type==f.type)&&(!q||(x.name+' '+x.email+' '+tLab(x.type)+' '+dIST(x.date)+' '+x.st).toLowerCase().includes(q))).sort((a,b)=>(a[f.k]>b[f.k]?1:a[f.k]<b[f.k]?-1:0)*f.dir)}
function bkSort(k){const f=BK.f;if(f.k==k)f.dir*=-1;else{f.k=k;f.dir=1}bkHist()}
function bkPage(n){BK.f.p+=n;bkHist()}
function bkHist(){if(!$('#bkHT'))return;const r=bkRows(),N=10,pg=Math.max(1,Math.ceil(r.length/N));if(BK.f.p>=pg)BK.f.p=pg-1;if(BK.f.p<0)BK.f.p=0;const sh=BK.f.all?r:r.slice(BK.f.p*N,BK.f.p*N+N);$('#bva').textContent=BK.f.all?'Show pages':'View All ('+r.length+')';
const sc={'Completed':'#16a34a','In Progress':'#2563eb','Limit Exceeded':'#dc2626'};
$('#bkHT').innerHTML=!BK.email?'<div class=empty>Select an employee to see break history.</div>':!r.length?'<div class=empty>No break records found.</div>':`<table><tr>${[['Date','startMs'],['Employee Name','name'],['Employee Email','email'],['Break Type','type'],['Start Time','startMs'],['End Time','endMs'],['Duration','d'],['Status','st']].map(c=>`<th onclick="bkSort('${c[1]}')">${c[0]}</th>`).join('')}</tr>${sh.map(x=>`<tr><td>${dIST(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${tLab(x.type)}</td><td>${tIST(x.startMs)}</td><td>${tIST(x.endMs)}</td><td>${mmss(x.d)}</td><td><span class=sb style="background:${sc[x.st]}22;color:${sc[x.st]}">${x.st}</span></td></tr>`).join('')}</table>`;
$('#bkPg').innerHTML=BK.f.all||pg<2?'':`<button class="btn g" onclick="bkPage(-1)" ${BK.f.p<1?'disabled':''}>‹ Previous</button> Page ${BK.f.p+1} of ${pg} <button class="btn g" onclick="bkPage(1)" ${BK.f.p>=pg-1?'disabled':''}>Next ›</button>`}
function bkExp(x){csv(['Date','Employee Name','Employee Email','Break Type','Start Time','End Time','Duration (mm:ss)','Status'],bkRows().map(y=>[dIST(y.date),y.name,y.email,tLab(y.type),tIST(y.startMs),tIST(y.endMs),mmss(y.d),y.st]),'break-history',x)}

/* ---------- ATTENDANCE MANAGEMENT ---------- */
const STC={'Present':['#dcfce7','#166534'],'Absent':['#fee2e2','#991b1b'],'Leave':['#ffedd5','#9a3412'],'Holiday':['#dbeafe','#1e40af'],'Week Off':['#e5e7eb','#374151'],'Regularized':['#ede9fe','#5b21b6'],'Leave / Present':['#ccfbf1','#115e59'],'Sick Leave / Present':['#d1fae5','#065f46'],'Casual Leave':['#fef9c3','#854d0e'],'Restricted Holiday':['#1e3a8a','#ffffff'],'Needs Review':['#fef3c7','#92400e']};
const stc=s=>STC[s]||['#f1f5f9','#0f172a'];
let AT={d:null,recs:[],month:'',email:'',f:{from:'',to:'',st:'',q:'',k:'d',dir:1,p:0}};
try{AT.email=localStorage.getItem('cda_at')||''}catch(e){}
const istToday=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Kolkata'});
const nz=x=>String(x).replace(/[\uFE0E\uFE0F\s]/g,'').normalize('NFC').toUpperCase();
function attRes(raw){const m=(AT.d&&AT.d.symbols)||[];if(raw===true||String(raw).toUpperCase()==='TRUE')return{sym:'✓',st:'Present',cnt:'present'};const k=nz(raw);if(!k||k==='FALSE')return null;
const h=m.find(x=>nz(x.symbol)===k)||m.find(x=>nz(x.status)===k);return h?{sym:h.symbol,st:h.status,cnt:h.counts}:{sym:'⚠',st:'Needs Review',cnt:'review',raw:String(raw)}}
async function attFetch(){try{const j=await api('mode=att_data');AT.d=j;AT.recs=(j.records||[]).map(r=>{const x=attRes(r.v);return x&&Object.assign({e:r.e,n:r.n,d:r.d,r:r.r||''},x)}).filter(Boolean);if(view=='att')attAll()}
catch(e){if($('#atTop'))$('#atTop').innerHTML=`<div class=alr style="background:#dc262615;border:1px solid #dc2626;color:#dc2626">Could not load attendance data: ${esc(e.message||e)}</div>`}}
function vAtt(v){v.innerHTML=`<div id=atTop></div><div class=card style="margin-top:14px"><h3 style="margin-top:0">Attendance History <button class="btn g" onclick="attExp()">⬇ CSV</button> <button class="btn g" onclick="attExp(1)">⬇ Excel</button></h3>
<p style="color:var(--mu);margin:0 0 10px;font-size:12px">Shows attendance exceptions only. Present days are not listed here.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><input type=date value="${AT.f.from}" onchange="AT.f.from=this.value;AT.f.p=0;attHist()" style="${FI}"><input type=date value="${AT.f.to}" onchange="AT.f.to=this.value;AT.f.p=0;attHist()" style="${FI}"><select id=atSt onchange="AT.f.st=this.value;AT.f.p=0;attHist()" style="${FI}"><option value="">All statuses</option></select><input placeholder="Search…" value="${esc(AT.f.q)}" oninput="AT.f.q=this.value;AT.f.p=0;attHist()" style="${FI};flex:1;min-width:140px"><button class="btn g" onclick="AT.f.from=AT.f.to=AT.f.q=AT.f.st='';render()">Clear</button></div><div id=atHT class=sc style="max-height:none"></div><div id=atPg style="margin-top:10px"></div></div>`;
if(!AT.month)AT.month=istToday().slice(0,7);
if(AT.d)attAll();else{$('#atTop').innerHTML='<div class=grid>'+'<div class=sk></div>'.repeat(4)+'</div>';attFetch()}}
function attAll(){attTop();attHist()}
function attPick(e){AT.email=e;AT.f.p=0;try{localStorage.setItem('cda_at',e)}catch(x){}attAll()}
function attMove(n){const [y,m]=AT.month.split('-').map(Number),d=new Date(Date.UTC(y,m-1+n,1));AT.month=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');attTop()}
function attKpi(l){const k={w:0,p:0,a:0,l:0,h:0,o:0};l.forEach(r=>{if(r.cnt=='present'){k.p++;k.w++}else if(r.cnt=='absent'){k.a++;k.w++}else if(r.cnt=='leave'){k.l++;k.w++}else if(r.cnt=='off'){if(r.st=='Holiday')k.h++;else if(r.st=='Week Off')k.o++}});k.rate=k.w?k.p/k.w*100:null;return k}
function attTop(){const d=AT.d;if(!d||!$('#atTop'))return;
const emps=d.employees.filter(e=>e.active!==false),[y,m]=AT.month.split('-').map(Number),single=AT.email&&AT.email!='*'?AT.email:null,scope=AT.email=='*'?null:AT.email;
const mr=AT.recs.filter(r=>r.d.startsWith(AT.month)&&(AT.email=='*'||(scope&&r.e==scope))),K=attKpi(mr);
const title=new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'}),noMail=emps.filter(e=>!e.email).map(e=>e.name);
const kp=[['Total Working Days',K.w],['Present Days',K.p],['Absent Days',K.a],['Leave Days',K.l],['Holidays',K.h],['Week Offs',K.o],['Attendance Rate',K.rate==null?'—':K.rate.toFixed(1)+'%']];
let cal='';
if(single){const first=new Date(Date.UTC(y,m-1,1)),lead=(first.getUTCDay()+6)%7,dim=new Date(Date.UTC(y,m,0)).getUTCDate(),idx={};mr.forEach(r=>idx[r.d]=r);
cal='<div class=cal>'+['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(w=>`<div class=wd>${w}</div>`).join('')+'<div></div>'.repeat(lead);
for(let i=1;i<=dim;i++){const dd=String(i).padStart(2,'0'),ds=AT.month+'-'+dd,r=idx[ds],td=ds==istToday()?' tdy':'';
cal+=r?`<div class="ac${td}" onclick="attDay('${ds}')" style="background:${stc(r.st)[0]};color:${stc(r.st)[1]}"><div class=as style="${r.st=='Present'?'color:#16a34a;font-weight:700':''}">${esc(r.sym)}</div><div class=ad>${dd}</div><div class=an>${esc(r.st)}</div></div>`:`<div class="ac neu${td}" onclick="attDay('${ds}')"><div class=as>&nbsp;</div><div class=ad>${dd}</div><div class=an>&nbsp;</div></div>`}cal+='</div>'}
else cal=`<div class=empty>${AT.email=='*'?'Select one employee to view the monthly calendar. The employee-wise summary below covers all employees.':'Select an employee to view the monthly attendance calendar.'}</div>`;
const sum=emps.map(e=>{const k=attKpi(AT.recs.filter(r=>r.d.startsWith(AT.month)&&e.email&&r.e==e.email));return`<tr class=cl onclick="attPick('${esc(e.email)}')"><td>${esc(e.name)}</td><td>${esc(e.email||'(email not configured)')}</td><td>${k.w}</td><td>${k.p}</td><td>${k.a}</td><td>${k.l}</td><td>${k.h}</td><td>${k.o}</td><td>${k.rate==null?'—':k.rate.toFixed(1)+'%'}</td></tr>`}).join('');
$('#atTop').innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center"><div><h2 style="margin:0">🗓️ Attendance Management</h2><span class=chip>Last updated: ${esc(d.updated||'—')}</span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end"><div><b>Employee Email *</b><br><select onchange="attPick(this.value)" style="${FI};min-width:260px"><option value="">Select employee…</option><option value="*" ${AT.email=='*'?'selected':''}>All Employees</option>${emps.map(e=>`<option value="${esc(e.email)}" ${e.email==AT.email?'selected':''} ${e.email?'':'disabled'}>${esc(e.name)} – ${esc(e.email||'email not configured')}</option>`).join('')}</select></div><button class=btn onclick="AT.d=null;vAtt($('#view'))">⟳ Refresh</button></div></div>
${d.unmapped&&d.unmapped.length?`<div class=alr style="background:#f59e0b18;border:1px solid #f59e0b;color:#b45309;margin-top:12px">⚠️ Attendance records were found for emails that are not configured in Settings: ${d.unmapped.map(esc).join(', ')}. They are not shown under any employee.</div>`:''}
${noMail.length?`<div class=alr style="background:#f59e0b18;border:1px solid #f59e0b;color:#b45309">⚠️ No email is configured for: ${noMail.map(esc).join(', ')}. Add it in Settings so their attendance can be shown.</div>`:''}
${AT.recs.some(r=>r.st=='Needs Review')?`<div class=alr style="background:#f59e0b18;border:1px solid #f59e0b;color:#b45309">⚠️ Some cells contain values that are not in the status mapping and are flagged as "Needs Review". Update the mapping in Settings or correct the sheet.</div>`:''}
${d.layout=='none'?`<div class=card style="margin-top:12px"><b>The attendance sheet layout was not recognised.</b><p style="color:var(--mu)">No attendance records could be read (rows: ${d.sheetRows}, columns: ${d.sheetCols}). Check the Spreadsheet ID / GID in Settings. Preview of what was read from the sheet:</p><div class=sc style="max-height:260px"><table>${(d.preview||[]).map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</table></div></div>`:''}
<div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn g" onclick="attMove(-1)">‹ Previous</button><input type=month value="${AT.month}" onchange="if(this.value){AT.month=this.value;attTop()}" style="${FI}"><button class="btn g" onclick="attMove(1)">Next ›</button><button class="btn g" onclick="AT.month=istToday().slice(0,7);attTop()">Today</button></div>
<div class=grid>${kp.map(k=>`<div class="card k"><div class=l><span>${k[0]}</span></div><div class=v>${k[1]}</div></div>`).join('')}</div>
<div class=card style="margin-top:14px"><h3 style="margin-top:0">Attendance Calendar · ${title}</h3>${cal}
<h4 style="margin:16px 0 8px">Attendance Status Legend</h4><div class=lgd>${(d.symbols||[]).map(s=>`<span style="background:${stc(s.status)[0]};color:${stc(s.status)[1]}"><b>${esc(s.symbol)}</b> ${esc(s.status)}</span>`).join('')}</div></div>
<h3>Employee-wise Summary · ${title}</h3><div class="card sc" style="max-height:none"><table><tr><th>Employee</th><th>Email</th><th>Working Days</th><th>Present</th><th>Absent</th><th>Leave</th><th>Holidays</th><th>Week Offs</th><th>Rate</th></tr>${sum}</table></div>`;
const sel=$('#atSt');if(sel&&sel.options.length<2){sel.innerHTML='<option value="">All statuses</option>'+(d.symbols||[]).map(s=>`<option ${AT.f.st==s.status?'selected':''}>${esc(s.status)}</option>`).join('')+'<option>Needs Review</option>'}}
function attDay(ds){const sc=AT.email=='*'?null:AT.email,r=AT.recs.find(x=>x.d==ds&&x.e==sc),e=(AT.d.employees||[]).find(x=>x.email==sc)||{name:'',email:sc};
modal(`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${dIST(ds)}</h2><button class="btn g" onclick="$('#modal').hidden=true">✕</button></div><p><b>${esc(e.name)}</b><br>${esc(e.email)}</p>${r?`<div style="font-size:42px">${esc(r.sym)}</div><p><b>${esc(r.st)}</b></p>${r.raw?`<p style="color:var(--mu)">Value in sheet: ${esc(r.raw)}</p>`:''}${r.r?`<p>Remarks: ${esc(r.r)}</p>`:''}`:'<p style="color:var(--mu)">No attendance data for this date.</p>'}`)}
function attHRows(){const f=AT.f,q=f.q.toLowerCase(),sc=AT.email=='*'?null:AT.email;if(!AT.email)return null;
return AT.recs.filter(x=>x.st!=='Present'&&(!sc||x.e==sc)&&(!f.from||x.d>=f.from)&&(!f.to||x.d<=f.to)&&(!f.st||x.st==f.st)&&(!q||(x.n+' '+x.e+' '+x.st+' '+x.r+' '+x.d).toLowerCase().includes(q))).sort((a,b)=>(a[f.k]>b[f.k]?1:a[f.k]<b[f.k]?-1:0)*f.dir)}
function attSort(k){const f=AT.f;if(f.k==k)f.dir*=-1;else{f.k=k;f.dir=1}attHist()}
function attPage(n){AT.f.p+=n;attHist()}
function attHist(){if(!$('#atHT'))return;const r=attHRows();if(r===null){$('#atHT').innerHTML='<div class=empty>Select an employee to see attendance history.</div>';$('#atPg').innerHTML='';return}
const N=15,pg=Math.max(1,Math.ceil(r.length/N));if(AT.f.p>=pg)AT.f.p=pg-1;if(AT.f.p<0)AT.f.p=0;const rem=r.some(x=>x.r),sh=r.slice(AT.f.p*N,AT.f.p*N+N);
$('#atHT').innerHTML=!r.length?'<div class=empty>No attendance exceptions found.</div>':`<table><tr>${[['Date','d'],['Employee Name','n'],['Employee Email','e'],['Attendance Status','st']].concat(rem?[['Remarks','r']]:[]).map(c=>`<th onclick="attSort('${c[1]}')">${c[0]}</th>`).join('')}</tr>${sh.map(x=>{const c=stc(x.st);return`<tr><td>${dIST(x.d)}</td><td>${esc(x.n)}</td><td>${esc(x.e)}</td><td><span class=sb style="background:${c[0]};color:${c[1]}">${esc(x.sym)} ${esc(x.st)}</span></td>${rem?`<td>${esc(x.r)}</td>`:''}</tr>`}).join('')}</table>`;
$('#atPg').innerHTML=pg<2?'':`<button class="btn g" onclick="attPage(-1)" ${AT.f.p<1?'disabled':''}>‹ Previous</button> Page ${AT.f.p+1} of ${pg} <button class="btn g" onclick="attPage(1)" ${AT.f.p>=pg-1?'disabled':''}>Next ›</button>`}
function attExp(x){const r=attHRows()||[],rem=r.some(y=>y.r);csv(['Date','Employee Name','Employee Email','Attendance Status'].concat(rem?['Remarks']:[]),r.map(y=>[dIST(y.d),y.n,y.e,y.st].concat(rem?[y.r]:[])),'attendance-history',x)}
